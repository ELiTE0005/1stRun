[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstrun"
version = "0.1.0"
description = "Runs a dev tool's quickstart in a clean container, finds the first step that breaks, and proves the fix with a second clean run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "neatlogs[anthropic]>=1.4.26",
    "claude-agent-sdk>=0.2.165",
    "pydantic>=2.7",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
firstrun = "firstrun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firstrun = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs network, Docker or model access (deselect with -m 'not live')",
]
