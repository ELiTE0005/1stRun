name: neatlogs issues

# Refresh the GitHub issues that mirror neatlogs detections and cost-guardrail alerts.
# Needs a NEATLOGS_TOKEN repo secret (a neatlogs service-account token). Without it the job skips.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEATLOGS_TOKEN: ${{ secrets.NEATLOGS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - if: env.NEATLOGS_TOKEN == ''
        run: echo "NEATLOGS_TOKEN is not set, so there is nothing to sync."
      - if: env.NEATLOGS_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.NEATLOGS_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: env.NEATLOGS_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: env.NEATLOGS_TOKEN != ''
        run: python scripts/neatlogs_issues.py --apply
