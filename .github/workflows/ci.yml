name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # The offline suite needs no network keys, Docker or model access.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
        env:
          ONESTRUN_NO_EXPORT: "1"
          ONESTRUN_ENV_FILE: /dev/null
